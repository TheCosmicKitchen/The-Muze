<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haiku Hunt · The Muze</title>
<meta name="description" content="Find a 5-7-5 haiku hidden in a page from a classic novel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600;700&family=Libre+Caslon+Text:ital@0;1&display=swap">
<link rel="stylesheet" href="muze.css">
<style>
/* Layout: prompt, the three haiku lines being built (sticky), then the book page to hunt through. */
.lines{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 12px;border:2px solid transparent;cursor:pointer;min-height:48px}
.ln.cur{border-color:var(--ink)}
.ln .n{font:600 15px var(--display);color:var(--muted)}
.ln.ok .n{color:var(--ok)}
.ln.over .n{color:var(--f2)}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;font:18px/1.3 var(--serif)}
.chip{display:inline-flex;align-items:baseline;gap:3px}
.chip .t{cursor:pointer}
.chip .t:hover{text-decoration:line-through}
.chip.frag .t{text-decoration:underline dotted;text-underline-offset:3px}
.chip sup{font:600 10px var(--display);color:var(--muted);background:var(--felt);border-radius:6px;padding:1px 4px;cursor:pointer}
.chips:empty::before{content:"tap words on the page";color:var(--muted);font:14px var(--body)}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:24px 24px 20px;box-shadow:0 1px 0 var(--paper-edge),0 10px 30px -18px rgba(0,0,0,.45)}
.src{font:italic 13px var(--serif);text-align:center;color:#7B7264;margin-bottom:12px}
.text{font:17px/1.95 var(--serif);user-select:none;-webkit-user-select:none}
.text p{margin:0;text-indent:1.4em}
.w{cursor:pointer;border-radius:4px;padding:.05em .1em}
.w:hover{background:rgba(0,0,0,.07)}
.w.used{background:rgba(214,151,32,.35)}
.w.part{background:rgba(214,151,32,.16);text-decoration:underline dotted rgba(140,98,20,.8);text-underline-offset:4px}
.text.snipping .w{cursor:crosshair}
/* Snipper: a sheet at the bottom of the screen for picking part of a word, letter by letter. */
.snip{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--ink);padding:14px max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 -10px 30px -18px rgba(0,0,0,.5)}
.snip .k{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.letters{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.letters button{font:22px var(--serif);min-width:34px;height:46px;border:2px solid var(--line);background:var(--paper);color:var(--paper-ink);border-radius:8px;cursor:pointer;padding:0 4px}
.letters button.in{background:var(--f2);border-color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="prompt" id="prompt"></div>
  <div class="lines" id="lines"></div>
  <div class="tools">
    <button class="btn primary" id="done" disabled>Finish</button>
    <button class="btn" id="undo">Undo word</button>
    <button class="btn" id="snip" aria-pressed="false" title="Take only part of a word">✂ Snip</button>
    <span class="gap"></span>
    <button class="btn" id="copy" hidden>Copy</button>
    <button class="btn" id="save" hidden>Save image</button>
  </div>
  <div class="paper"><div class="src" id="src"></div><div class="text" id="text"></div></div>
  <p class="foot">Pick words in any order. Use ✂ Snip to take just part of a word. Tap a word in your haiku to take it out. The 5-7-5 count is a guide, not a rule, and it can be wrong: tap a word's number to correct it.</p>
</div>
<div class="snip" id="snipper" hidden>
  <div class="k">Tap the first and last letter to keep</div>
  <div class="letters" id="letters"></div>
  <div class="tools"><button class="btn primary" id="snipAdd" disabled>Add</button><button class="btn" id="snipCancel">Cancel</button></div>
</div>
<script src="data/pages.js"></script>
<script src="data/syllables.js"></script>
<script src="muze.js"></script>
<script>
Muze.header({ title: 'Haiku Hunt', another: 'Another page' });
const GAME = 'haiku', TARGET = [5, 7, 5];

// Same shuffled order as Blackout, offset by half a year so the pages differ.
const order = Muze.shuffle(PAGES.map((_, i) => i), Muze.rng('muze-blackout-order'));
const pageIdx = Muze.daily ? order[(Muze.day - 1 + 190) % order.length] : Math.floor(Muze.rng(Muze.seed + 'haiku')() * PAGES.length);
const page = PAGES[pageIdx], book = BOOKS[page.b];
document.getElementById('prompt').innerHTML =
  `<span class="k">Hunt through</span><span class="v">${book.t}</span><span class="s">${book.a} · Pick words, or parts of words, in any order. Aim for lines of 5, 7 and 5 syllables, or finish whenever it feels right.</span>`;
document.getElementById('src').textContent = `from ${book.t}, ${book.a}`;

const textEl = document.getElementById('text'), words = [];
page.t.split('\n').forEach(par => {
  const p = document.createElement('p');
  par.split(' ').forEach((tok, k) => {
    const s = document.createElement('span'); s.className = 'w'; s.dataset.i = words.length; s.textContent = tok;
    if (k) p.append(' ');
    p.append(s); words.push(s);
  });
  textEl.append(p);
});
const clean = w => w.replace(/^[^\p{L}]+|[^\p{L}’']+$/gu, '');

// A line holds picks in the order they were tapped. A pick is a word index (the whole word)
// or {i, a, b}: letters a..b of word i. Older saves only have word indices, which still work.
const st = Muze.load(GAME) || { lines: [[], [], []], fix: {}, cur: 0, done: false };
const wi = p => typeof p === 'number' ? p : p.i;
const key = p => typeof p === 'number' ? String(p) : `${p.i}:${p.a}-${p.b}`;
const letters = i => Array.from(clean(words[i].textContent));
const piece = p => typeof p === 'number' ? clean(words[p].textContent) : letters(p.i).slice(p.a, p.b + 1).join('');
const syl = p => st.fix[key(p)] ?? Muze.syllables(piece(p));
const count = l => st.lines[l].reduce((n, p) => n + syl(p), 0);
const text = () => st.lines.filter(l => l.length).map(l => l.map(piece).join(' ')).join('\n');
const findPick = k => { for (const l of st.lines) { const j = l.findIndex(p => key(p) === k); if (j >= 0) return [l, j]; } return null; };
function add(p) {
  if (findPick(key(p))) return Muze.toast('Already in your haiku');
  st.lines[st.cur].push(p);
  if (st.cur < 2 && count(st.cur) === TARGET[st.cur]) st.cur++;
  st.done = false; persist();
}

const linesEl = document.getElementById('lines');
function render() {
  linesEl.innerHTML = '';
  st.lines.forEach((l, li) => {
    const n = count(li), row = document.createElement('div');
    row.className = 'ln' + (li === st.cur ? ' cur' : '') + (n === TARGET[li] ? ' ok' : n > TARGET[li] ? ' over' : '');
    row.innerHTML = `<span class="n">${n}/${TARGET[li]}</span><span class="chips"></span>`;
    const chips = row.querySelector('.chips');
    l.forEach((p, k) => {
      const c = document.createElement('span'); c.className = 'chip' + (typeof p === 'number' ? '' : ' frag');
      const t = document.createElement('span'); t.className = 't'; t.textContent = piece(p); t.title = 'Tap to take it out';
      t.onclick = e => { e.stopPropagation(); l.splice(k, 1); st.done = false; persist(); };
      const sup = document.createElement('sup'); sup.textContent = syl(p); sup.title = 'Tap to correct the syllable count';
      sup.onclick = e => { e.stopPropagation(); st.fix[key(p)] = syl(p) % 5 + 1; persist(); };
      c.append(t, sup); chips.append(c);
    });
    row.onclick = () => { st.cur = li; persist(); };
    linesEl.append(row);
  });
  const all = st.lines.flat(), whole = new Set(all.filter(p => typeof p === 'number')), part = new Set(all.map(wi));
  words.forEach((w, i) => { w.classList.toggle('used', whole.has(i)); w.classList.toggle('part', part.has(i) && !whole.has(i)); });
  // 5-7-5 is a target, not a rule: any words at all can be finished.
  const ok = all.length > 0;
  const done = document.getElementById('done');
  done.disabled = !ok; done.textContent = st.done && ok ? 'Finished ✓' : 'Finish';
  document.getElementById('copy').hidden = document.getElementById('save').hidden = !(st.done && ok);
}
function persist() { Muze.save(GAME, st); render(); }

// Snip mode: the next word tapped opens the snipper instead of being picked whole.
const snipBtn = document.getElementById('snip'), snipper = document.getElementById('snipper'),
  lettersEl = document.getElementById('letters'), snipAdd = document.getElementById('snipAdd');
let snipping = false, sn = null;
function setSnipping(on) { snipping = on; snipBtn.setAttribute('aria-pressed', on); textEl.classList.toggle('snipping', on); if (!on) closeSnip(); }
function openSnip(i) {
  sn = { i, chars: letters(i), a: null, b: null, anchor: null };
  snipper.hidden = false; drawSnip();
}
function closeSnip() { sn = null; snipper.hidden = true; }
function drawSnip() {
  lettersEl.innerHTML = '';
  sn.chars.forEach((ch, k) => {
    const b = document.createElement('button'); b.textContent = ch;
    b.className = sn.a !== null && k >= sn.a && k <= sn.b ? 'in' : '';
    b.onclick = () => {
      // First tap marks one letter; the second stretches to it; a third starts again.
      if (sn.anchor === null) { sn.anchor = k; sn.a = sn.b = k; }
      else { sn.a = Math.min(sn.anchor, k); sn.b = Math.max(sn.anchor, k); sn.anchor = null; }
      drawSnip();
    };
    lettersEl.append(b);
  });
  const frag = sn.a === null ? '' : sn.chars.slice(sn.a, sn.b + 1).join('');
  snipAdd.disabled = !/\p{L}/u.test(frag);
  snipAdd.textContent = frag ? `Add “${frag}”` : 'Add';
}
snipBtn.onclick = () => setSnipping(!snipping);
document.getElementById('snipCancel').onclick = closeSnip;
snipAdd.onclick = () => {
  const { i, a, b, chars } = sn;
  setSnipping(false);
  add(a === 0 && b === chars.length - 1 ? i : { i, a, b });
};
addEventListener('keydown', e => { if (e.key === 'Escape' && sn) closeSnip(); });

textEl.addEventListener('click', e => {
  const w = e.target.closest('.w'); if (!w) return;
  const i = +w.dataset.i;
  if (!clean(w.textContent)) return;
  if (snipping) return openSnip(i);
  const hit = findPick(String(i));
  if (hit) { hit[0].splice(hit[1], 1); st.done = false; return persist(); }
  add(i);
});
document.getElementById('undo').onclick = () => {
  let li = st.cur; while (li > 0 && !st.lines[li].length) li--;
  const l = st.lines[li]; if (!l.length) return;
  l.pop(); st.cur = li; st.done = false; persist();
};
document.getElementById('done').onclick = () => { st.done = true; Muze.keep(GAME, text()); persist(); Muze.addToGallery(GAME); };
document.getElementById('copy').onclick = () => Muze.copy(`${text()}\n\n(found in ${book.t}, ${book.a})\n${Muze.tag}`);
document.getElementById('save').onclick = async () => {
  await document.fonts.ready;
  Muze.download(Muze.card({ blocks: [
    { text: text(), font: 'italic 44px "Libre Caslon Text", Georgia, serif', lh: 66 },
    { text: `found in ${book.t}, ${book.a}`, font: 'italic 22px "Libre Caslon Text", Georgia, serif', color: '#7B7264', gap: 40 },
    { text: Muze.tag.toUpperCase(), font: '700 18px Nunito, sans-serif', color: '#7B7264', gap: 14 },
  ] }), 'haiku');
};
render();
</script>
</body>
</html>
