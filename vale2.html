<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vale 2 · The Muze</title>
<meta name="description" content="A valley that grows a little every day. Five tiles and one villager's wish a day; seasons turn each week. Nothing to lose.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="muze.css">
<style>
/* Layout: the season and today's villager wishes; the valley (a fixed hex map that fits a phone);
   today's five tiles plus your shed of buildings; the field guide; past valleys. */
.wrap{max-width:900px}
.valley{border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--paper-edge),0 10px 30px -18px rgba(0,0,0,.45);background:#BFE0D8}
#cv{display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer}
.asks{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ask{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;background:var(--felt);border-radius:12px;padding:8px 10px}
.ask .face{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--display);color:#fff}
.ask b{font:700 15px var(--body);color:var(--ink);min-width:0}
.ask small{font-size:13px;color:var(--muted);grid-column:2}
.ask .st{grid-row:span 2;font:700 12px var(--body);border-radius:999px;padding:3px 9px;background:var(--surface);color:var(--muted);white-space:nowrap}
.ask.met .st{background:var(--ok);color:var(--surface)}
.trayrow{display:flex;flex-direction:column;gap:6px}
.trayhead{display:flex;justify-content:space-between;gap:10px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tray{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tray.shed{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;background:var(--surface);border:3px solid transparent;border-radius:14px;padding:3px 2px 4px;cursor:pointer;color:var(--ink);font:700 12px var(--body)}
.tile canvas{width:100%;max-width:76px;height:auto;aspect-ratio:152/120;display:block}
.tile[aria-pressed="true"]{border-color:var(--ink)}
.tile:disabled{opacity:.35;cursor:default}
.tile .n{position:absolute;top:2px;right:6px;font:700 12px var(--body);color:var(--muted)}
.tile:focus-visible{outline:2.5px solid var(--f1);outline-offset:2px}
.status{font-size:14px;color:var(--muted);text-align:center;min-height:1.4em}
details.guide{background:var(--surface);border-radius:16px;padding:10px 14px}
details.guide summary{cursor:pointer;font:700 15px var(--display)}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 16px;margin-top:10px}
.book div{font-size:14px;color:var(--muted)}
.book b{display:block;color:var(--ink);font:700 15px var(--body)}
.book div.off b{color:var(--muted)}
.keeps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.keeps figure{margin:0;background:#B98B3A;padding:6px;border-radius:4px;box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}
.keeps img{display:block;width:100%;height:auto;border:2px solid #E2BC6A}
.keeps figcaption{font:700 12px var(--body);color:#2B211B;text-align:center;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="prompt" id="prompt"></div>
  <div class="valley"><canvas id="cv" width="1200" height="800" aria-label="Your valley: a hex map of 37 spaces. Pick a tile, then tap a space. Tapping a filled space rebuilds it."></canvas></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="trayrow"><div class="trayhead"><span>Today's tiles</span><span id="left"></span></div><div class="tray" id="tray" role="group" aria-label="Today's tiles"></div></div>
  <div class="trayrow" id="shedRow" hidden><div class="trayhead"><span>Your shed</span><span>buildings you've earned</span></div><div class="tray shed" id="shed" role="group" aria-label="Your shed"></div></div>
  <div class="tools">
    <button class="btn" id="undo">Undo</button>
    <span class="gap"></span>
    <button class="btn" id="save">Save image</button>
  </div>
  <details class="guide"><summary id="guideHead">Field guide</summary><div class="book" id="book"></div></details>
  <details class="guide" id="pastWrap" hidden><summary id="pastHead">Past valleys</summary><div class="keeps" id="keeps"></div></details>
  <p class="foot">Prototype · a new valley every four weeks, one season a week · tiles and villagers are the same for everyone each day · your valley stays on this device</p>
</div>
<script src="streak.js"></script>
<script src="muze.js"></script>
<script src="folk.js"></script>
<script>
Muze.header({ title: 'Vale 2', another: false });
const GAME = 'vale';
// ---------- Tiles ----------
const TYPES = { meadow: { name: 'Meadow' }, tree: { name: 'Trees' }, water: { name: 'Water' }, field: { name: 'Field' }, house: { name: 'Cottage' },
  path: { name: 'Lane' }, hill: { name: 'Hill' }, mill: { name: 'Windmill' }, well: { name: 'Well' }, chapel: { name: 'Chapel' }, hive: { name: 'Beehives' }, lamp: { name: 'Lamp post' } };
const SEASONS = {
  spring: { sky: ['#CFEBE4', '#EAF3D8'], meadow: '#A9D37F', meadow2: '#BCDD8E', tree: '#5FA463', tree2: '#7DBB6C', water: '#7FC4D6', water2: '#A5DAE3', field: '#D9C57C', hill: '#9CBF76', side: '#8A6B4C', roof: '#C8664A', flower: '#F2A7C0' },
  summer: { sky: ['#BFE3EE', '#F2EFCB'], meadow: '#96C869', meadow2: '#AAD577', tree: '#3F8A52', tree2: '#5CA25C', water: '#5DB3CE', water2: '#8BD0DE', field: '#E3C766', hill: '#88AE63', side: '#7D5F42', roof: '#B9503A', flower: '#FFD65C' },
  autumn: { sky: ['#F3DDBB', '#F7EBD3'], meadow: '#C4BE6E', meadow2: '#D2C87B', tree: '#C9702F', tree2: '#E0A23A', water: '#6FA9B8', water2: '#9CC8CF', field: '#D8A94F', hill: '#A99A5C', side: '#7A5A3E', roof: '#8F3F2E', flower: '#E8833A' },
  winter: { sky: ['#D5E2EE', '#EEF2F5'], meadow: '#EDF3F4', meadow2: '#F8FAFA', tree: '#3E6F62', tree2: '#5C8A7A', water: '#8EB9CF', water2: '#B7D5E2', field: '#DDE2DF', hill: '#D9E3E6', side: '#7E8A94', roof: '#7A4B3F', flower: '#FFFFFF' },
};

// ---------- Neighbour interactions (as in Vale, plus the four buildings you can earn) ----------
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const key = (q, r) => `${q},${r}`;
const FINDS = {
  thicket: ['Thicket', 'Three trees in a clump grow thick and tall.', 'Trees like company.'],
  deepwood: ['Deep woods', 'Six trees together, and a deer moves in.', 'A really big clump of trees.'],
  lake: ['Lake', 'Four waters join up and the ducks arrive.', 'Keep joining water to water.'],
  jetty: ['Jetty', 'A cottage on the water builds a jetty and a boat.', 'A cottage wants a view of the water.'],
  farm: ['Farmstead', 'A cottage beside a field brings a scarecrow and hay.', 'Someone has to mind the crops.'],
  hamlet: ['Hamlet', 'Three cottages together raise a little chapel.', 'Neighbours, and more neighbours.'],
  gold: ['Golden wheat', 'A windmill beside a field spins, and the wheat turns gold.', 'What does a windmill need to grind?'],
  reeds: ['Water meadow', 'A field by the water grows reeds and herons.', 'Crops need watering.'],
  flowers: ['Wildflowers', 'A meadow by the water blooms.', 'Flowers are thirsty too.'],
  bees: ['Bee skeps', 'A meadow beside a field gets beehives.', 'Something has to visit the crops.'],
  sheep: ['Sheep', 'A meadow beside a cottage fills with sheep.', 'A cottage and some open grass.'],
  peak: ['Snowy peak', 'Three hills together rise into a snowy mountain.', 'Hills pile up.'],
  falls: ['Waterfall', 'A hill above water pours a stream down its side.', 'Water runs downhill.'],
  orchard: ['Orchard', 'Trees beside a field bear apples.', 'Trees near the farmland.'],
  lanterns: ['Lanterns', 'A lane between two cottages gets lit up.', 'Connect one door to another.'],
  bridge: ['Bridge', 'A lane with water on two sides becomes a bridge.', 'Build a lane across the water.'],
  spring: ['Village well', 'A well beside a cottage, and the neighbours stop to chat.', 'Water, close to home.'],
  bells: ['Wedding bells', 'A chapel with two cottages beside it rings out.', 'A chapel needs a congregation.'],
  honey: ['Honey', 'Beehives beside a meadow fill up with honey.', 'Bees need somewhere to forage.'],
  lamplit: ['Lamplit lane', 'A lamp post beside a lane lights the way home.', 'Light the way.'],
};

// Works out what every tile becomes from its neighbours. Returns tile features and the set of finds.
function study(map) {
  const fx = new Map(), found = new Set();
  const mark = (k, f) => { if (!fx.has(k)) fx.set(k, new Set()); fx.get(k).add(f); found.add(f); };
  const near = (q, r) => DIRS.map(([a, b]) => map.get(key(q + a, r + b)));
  const seen = new Set();
  const group = (k0, t) => {
    const out = [], todo = [k0]; seen.add(k0);
    while (todo.length) {
      const k = todo.pop(); out.push(k); const [q, r] = k.split(',').map(Number);
      DIRS.forEach(([a, b]) => { const n = key(q + a, r + b); if (map.get(n) === t && !seen.has(n)) { seen.add(n); todo.push(n); } });
    }
    return out;
  };
  for (const [k, t] of map) {
    const [q, r] = k.split(',').map(Number), ns = near(q, r), has = x => ns.includes(x);
    if (!seen.has(k) && ['tree', 'water', 'house', 'hill'].includes(t)) {
      const g = group(k, t);
      if (t === 'tree' && g.length >= 3) g.forEach(x => mark(x, 'thicket'));
      if (t === 'tree' && g.length >= 6) mark(g[0], 'deepwood');
      if (t === 'water' && g.length >= 4) { mark(g[0], 'lake'); }
      if (t === 'house' && g.length >= 3) mark(g[0], 'hamlet');
      if (t === 'hill' && g.length >= 3) g.forEach(x => mark(x, 'peak'));
    }
    if (t === 'house' && has('water')) mark(k, 'jetty');
    if (t === 'house' && has('field')) mark(k, 'farm');
    if (t === 'mill' && has('field')) {
      mark(k, 'gold');
      DIRS.forEach(([a, b]) => { const n = key(q + a, r + b); if (map.get(n) === 'field') mark(n, 'gold'); });
    }
    if (t === 'field' && has('water')) mark(k, 'reeds');
    if (t === 'meadow' && has('water')) mark(k, 'flowers');
    if (t === 'meadow' && has('field')) mark(k, 'bees');
    if (t === 'meadow' && has('house')) mark(k, 'sheep');
    if (t === 'hill' && has('water')) mark(k, 'falls');
    if (t === 'tree' && has('field')) mark(k, 'orchard');
    if (t === 'well' && has('house')) mark(k, 'spring');
    if (t === 'chapel' && ns.filter(x => x === 'house').length >= 2) mark(k, 'bells');
    if (t === 'hive' && has('meadow')) mark(k, 'honey');
    if (t === 'lamp' && has('path')) mark(k, 'lamplit');
    if (t === 'path') {
      if (ns.filter(x => x === 'house').length >= 2) mark(k, 'lanterns');
      if ([0, 1, 2].some(i => ns[i] === 'water' && ns[i + 3] === 'water')) mark(k, 'bridge');
    }
  }
  return { fx, found };
}

// ---------- Drawing ----------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const W = cv.width, H = cv.height, R = 58, SQ = 0.66, DEPTH = 13;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const world = (q, r) => [R * 1.732 * (q + r / 2), R * 1.5 * SQ * r];
const cam = { x: 0, y: 0, s: 1 };
const spin = new Map();   // tile key -> time it was placed, for the little drop
const hops = new Map();   // tile key -> time it should hop because a neighbour changed it
let sparks = [];

const sheepAt = (q, r, i) => { const n = Muze.rng(`${q}/${r}/sheep${i}`); return [(n() - .5) * R * 1.15, (n() - .5) * R * SQ * 1.1]; };
const treesAt = (q, r, count) => { const n = Muze.rng(`${q}/${r}/trees`); return Array.from({ length: count }, () => [(n() - .5) * R * 1.15, (n() - .5) * R * SQ * 1.2]).sort((a, b) => a[1] - b[1]); };
const treeCount = fx => fx?.has('thicket') ? 6 : 3;
function hex(c, x, y, rr = R) {
  c.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3, px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * SQ; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath();
}
function base(c, x, y, t, fx) {
  const top = { meadow: C.meadow, tree: C.meadow, water: C.water, field: fx?.has('gold') ? '#EFC94A' : C.field, house: C.meadow2, path: C.meadow, hill: C.meadow, mill: C.meadow2, well: C.meadow2, chapel: C.meadow2, hive: C.meadow, lamp: C.meadow }[t];
  c.fillStyle = C.side; hex(c, x, y + DEPTH); c.fill();
  c.fillRect(x - R * 0.866, y, R * 1.732, DEPTH);
  c.fillStyle = top; hex(c, x, y, R + 0.6); c.fill();
}
function tree(c, x, y, s, pine, apples, rnd) {
  c.fillStyle = '#6E4B30'; c.fillRect(x - 2 * s, y - 8 * s, 4 * s, 9 * s);
  if (pine) {
    [[0, 16], [-8, 13], [-16, 10]].forEach(([o, w], i) => {
      c.fillStyle = i % 2 ? C.tree2 : C.tree; c.beginPath(); c.moveTo(x - w * s, y - 6 * s + o * s); c.lineTo(x + w * s, y - 6 * s + o * s); c.lineTo(x, y - 24 * s + o * s); c.fill();
    });
    if (seasonName === 'winter') { c.fillStyle = '#FFF'; c.beginPath(); c.moveTo(x - 5 * s, y - 28 * s); c.lineTo(x + 5 * s, y - 28 * s); c.lineTo(x, y - 40 * s); c.fill(); }
    return;
  }
  c.fillStyle = C.tree; c.beginPath(); c.arc(x, y - 18 * s, 14 * s, 0, 7); c.fill();
  c.fillStyle = C.tree2; c.beginPath(); c.arc(x - 4 * s, y - 22 * s, 8 * s, 0, 7); c.fill();
  if (apples) { c.fillStyle = '#D23B2E'; for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(x + (rnd() - .5) * 20 * s, y - 18 * s + (rnd() - .5) * 18 * s, 2.2 * s, 0, 7); c.fill(); } }
}
function house(c, x, y, rnd, now, fx) {
  const w = 19, h = 15, wall = ['#F4E9D2', '#EAD8BE', '#F7EFE0'][Math.floor(rnd() * 3)];
  c.fillStyle = wall; c.fillRect(x - w, y - h, w * 2, h);
  c.fillStyle = C.roof; c.beginPath(); c.moveTo(x - w - 5, y - h); c.lineTo(x + w + 5, y - h); c.lineTo(x + w - 5, y - h - 17); c.lineTo(x - w + 5, y - h - 17); c.fill();
  c.fillStyle = '#6E4B30'; c.fillRect(x - 3, y - 10, 7, 10);
  c.fillStyle = '#F9CF5A'; c.fillRect(x - 14, y - 11, 6, 6); c.fillRect(x + 9, y - 11, 6, 6);
  c.fillStyle = '#7B5B4A'; c.fillRect(x + 8, y - h - 22, 6, 11);
  c.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 3; i++) { const p = ((now / 2400 + i / 3 + rnd()) % 1); c.beginPath(); c.arc(x + 11 + p * 8, y - h - 24 - p * 22, 2 + p * 3.5, 0, 7); c.fill(); }
  if (fx?.has('hamlet')) {
    c.fillStyle = '#F4E9D2'; c.fillRect(x - 40, y - 34, 14, 30);
    c.fillStyle = C.roof; c.beginPath(); c.moveTo(x - 43, y - 34); c.lineTo(x - 23, y - 34); c.lineTo(x - 33, y - 58); c.fill();
    c.strokeStyle = '#6E4B30'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(x - 33, y - 66); c.lineTo(x - 33, y - 56); c.moveTo(x - 36, y - 62); c.lineTo(x - 30, y - 62); c.stroke();
  }
}
function details(c, q, r, x, y, t, fx, now) {
  const rnd = Muze.rng(`${q}/${r}`), spot = (m = 0.55) => [x + (rnd() - .5) * R * 1.3 * m * 1.4, y + (rnd() - .5) * R * SQ * m * 1.5];
  if (t === 'meadow') {
    const blooms = fx?.has('flowers') ? 22 : 7;
    for (let i = 0; i < blooms; i++) { const [a, b] = spot(1); c.fillStyle = fx?.has('flowers') && i % 2 ? C.flower : C.meadow2; c.beginPath(); c.arc(a, b, fx?.has('flowers') ? 2.4 : 3, 0, 7); c.fill(); }
    if (fx?.has('flowers') && !still) for (let i = 0; i < 2; i++) {
      const a = x + Math.sin(now / 1500 + i * 2.1) * 30 + Math.sin(now / 410 + i) * 5, b = y - 14 + Math.cos(now / 1100 + i * 3) * 13, w = 2 + Math.abs(Math.sin(now / 70 + i)) * 3.4;
      c.fillStyle = i ? '#F6A23C' : '#F2F2FF'; c.beginPath(); c.ellipse(a - w * .6, b, w * .7, 3, 0, 0, 7); c.ellipse(a + w * .6, b, w * .7, 3, 0, 0, 7); c.fill();
    }
    if (fx?.has('bees')) { const [a, b] = spot(.7); c.fillStyle = '#D9B15B'; c.beginPath(); c.ellipse(a, b - 6, 7, 9, 0, 0, 7); c.fill(); c.strokeStyle = '#A97F36'; c.lineWidth = 1; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(a - 6, b - 9 + i * 4); c.lineTo(a + 6, b - 9 + i * 4); c.stroke(); } c.fillStyle = '#2B211B'; c.fillRect(a + Math.sin(now / 240) * 14, b - 14 + Math.cos(now / 170) * 6, 2, 2); }
    if (fx?.has('sheep')) for (let i = 0; i < 3; i++) { const [ax, ay] = sheepAt(q, r, i), a = x + ax, b = y + ay, d = Math.sin(now / 1800 + i) * 3; c.fillStyle = '#FFF'; c.beginPath(); c.ellipse(a + d, b, 8, 5.5, 0, 0, 7); c.fill(); c.fillStyle = '#3A3230'; c.beginPath(); c.arc(a + d + 8, b - 2, 2.6, 0, 7); c.fill(); c.fillRect(a + d - 4, b + 4, 1.5, 3); c.fillRect(a + d + 3, b + 4, 1.5, 3); }
  }
  if (t === 'tree') {
    const list = treesAt(q, r, treeCount(fx)).map(([a, b]) => [x + a, y + b]), hit = chopped.get(key(q, r));
    list.forEach(([a, b], i) => {
      let lean = still ? 0 : Math.sin(now / 1300 + a * .03 + b * .05) * .05;
      if (hit && i === list.length - 1 && now > hit && now - hit < 300) lean += Math.sin((now - hit) / 22) * .13 * (1 - (now - hit) / 300);
      c.save(); c.translate(a, b); c.transform(1, 0, lean, 1, 0, 0); c.translate(-a, -b);
      tree(c, a, b, fx?.has('thicket') ? 1.15 : 1, fx?.has('orchard') ? false : rnd() < .6, fx?.has('orchard'), rnd);
      c.restore();
    });
    if (fx?.has('deepwood')) { const a = x + 10, b = y + 14; c.fillStyle = '#A9743F'; c.beginPath(); c.ellipse(a, b, 9, 5, 0, 0, 7); c.fill(); c.fillRect(a - 7, b + 3, 2, 7); c.fillRect(a + 5, b + 3, 2, 7); c.fillRect(a + 7, b - 11, 4, 9); c.strokeStyle = '#6E4B30'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(a + 9, b - 11); c.lineTo(a + 5, b - 17); c.moveTo(a + 9, b - 11); c.lineTo(a + 13, b - 17); c.stroke(); }
  }
  if (t === 'water') {
    c.strokeStyle = C.water2; c.lineWidth = 2;
    for (let i = 0; i < 4; i++) { const [a, b] = spot(1), d = still ? 0 : Math.sin(now / 900 + i * 2) * 5; c.beginPath(); c.moveTo(a - 9 + d, b); c.quadraticCurveTo(a + d, b - 3, a + 9 + d, b); c.stroke(); }
    const leap = ((now / 8000) + rnd()) % 1;
    if (!still && leap < .07) {
      const [a, b] = spot(.8), p = leap / .07, h = Math.sin(p * Math.PI) * 20;
      c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(a, b, 5 + p * 12, 2 + p * 4, 0, 0, 7); c.stroke();
      c.save(); c.translate(a - 11 + p * 22, b - h); c.rotate(-1 + p * 2); c.fillStyle = '#E98B4A'; c.beginPath(); c.ellipse(0, 0, 7, 3, 0, 0, 7); c.fill(); c.beginPath(); c.moveTo(-6, 0); c.lineTo(-12, -4); c.lineTo(-12, 4); c.fill(); c.restore();
    }
    if (fx?.has('lake')) for (let i = 0; i < 2; i++) { const a = x - 14 + i * 26 + (still ? 0 : Math.sin(now / 2600 + i) * 12), b = y - 6 + i * 12; c.fillStyle = '#FFF'; c.beginPath(); c.ellipse(a, b, 7, 4, 0, 0, 7); c.fill(); c.beginPath(); c.arc(a + 6, b - 4, 3, 0, 7); c.fill(); c.fillStyle = '#F0A030'; c.fillRect(a + 8.5, b - 4.5, 3, 1.6); }
  }
  if (t === 'field') {
    c.save(); hex(c, x, y, R - 7); c.clip();
    c.strokeStyle = fx?.has('gold') ? '#C99A22' : 'rgba(120,90,40,.4)'; c.lineWidth = 2.5;
    for (let i = -6; i <= 6; i++) { c.beginPath(); c.moveTo(x + i * 13 - 30, y + 40); c.lineTo(x + i * 13 + 30, y - 40); c.stroke(); }
    c.restore();
    if (!still) {
      c.save(); hex(c, x, y, R - 7); c.clip();
      const sweep = ((now / 26 + x * .6) % 230) - 115;
      c.fillStyle = fx?.has('gold') ? 'rgba(255,244,180,.38)' : 'rgba(255,255,255,.16)';

  const t0 = performance.now(), [px, py] = world(q, r);
  spin.set(k, t0);
  for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; sparks.push({ x: px + Math.cos(a) * 44, y: py + Math.sin(a) * 28 + 8, t: t0 + 200, dust: true, dx: Math.cos(a) * 34, dy: Math.sin(a) * 18 }); }
  for (const [kk, set] of info.fx) if ([...set].some(f => !oldFx.get(kk)?.has(f))) { const far = hexDist(kk, k); if (far) hops.set(kk, t0 + 240 + far * 90); }
  syncFolk();
  const notes = [];
  const found = [...info.found].filter(f => !before.has(f) && !book.has(f));
  found.forEach(f => book.add(f)); write(BOOK, [...book]);
  if (found.length) notes.push(`New in the field guide: ${FINDS[found[0]][0]}${found.length > 1 ? ` and ${found.length - 1} more` : ''}.`);
  // Requests are checked against the whole valley, so an old request can come good later.
  for (const p of active()) {
    if (isMet(p) || !REQ[p.id].check(map)) continue;
    if (p.from === TODAY) D().met = true; else { st.met.push(p.id + '@' + p.from); st.pending = st.pending.filter(o => o !== p); }
    const gift = GIFTS.find(gname => !st.gifts.includes(gname)) || Muze.pick(GIFTS, Muze.rng('vale2-gift-' + TODAY + p.id));
    if (!st.gifts.includes(gift)) st.gifts.push(gift);
    st.shed[gift] = (st.shed[gift] || 0) + 1;
    notes.unshift(`${REQ[p.id].who} is delighted, and leaves you a ${TYPES[gift].name.toLowerCase()}.`);
    cheerUntil = t0 + 1800;
    for (let i = 0; i < 22; i++) sparks.push({ x: px, y: py, t: t0, dx: (Math.random() - .5) * 140, dy: (Math.random() - .5) * 90 });
  }
  if (notes.length) { say(notes.join(' ')); Muze.toast(notes[0]); }
  else say(prev ? `Rebuilt: ${TYPES[prev].name.toLowerCase()} → ${TYPES[s.t].name.toLowerCase()}.` : '');
  dayDone();
  write(KEY, st); renderTray(); renderSide(); refreshHints();
}
// A day counts once today's visitor is happy or all five tiles are down.
function dayDone() {
  const d = D(); if (!(d.met || d.used.length === DRAW.tiles.length)) return;
  if (!REAL) return;
  if (window.Kitchen) Kitchen.mark('vale');
  if (!d.gal) { d.gal = true; Muze.addToGallery(GAME, saveImage); }
  if (CAL.day === 27) Muze.toast('The last day of this valley. It will be framed when the new one starts.');
}
cv.addEventListener('pointermove', e => { hover = atCell(e); });
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('click', e => { const s = atCell(e); if (s) place(...s); });
document.getElementById('undo').onclick = () => {
  const h = D().hist.pop(); if (!h) return Muze.toast('Nothing to undo today');
  const [q, r] = split(h.k);
  setTile(q, r, h.prev);
  if (h.prev && GIFTS.includes(h.prev)) st.shed[h.prev]--;
  if (h.src === 'day') D().used = D().used.filter(i => i !== h.i); else st.shed[h.g]++;
  info = study(map); syncFolk(); say('');
  write(KEY, st); renderTray(); renderSide(); refreshHints();
};
async function saveImage() {
  await document.fonts.ready;
  const foot = 64, c = document.createElement('canvas'); c.width = W; c.height = H + foot;
  const x = c.getContext('2d');
  paintScene(x, 0, false);
  x.fillStyle = '#FBF6EC'; x.fillRect(0, H, W, foot);
  x.fillStyle = '#7A6A5D'; x.font = '700 24px Nunito, sans-serif'; x.textAlign = 'center';
  x.fillText(`Valley ${CAL.valley} · ${seasonName}, week ${CAL.week + 1} · ${st.tiles.length} tiles · ${Muze.tag}`, W / 2, H + 40);
  Muze.download(c, 'vale');
}
document.getElementById('save').onclick = saveImage;

// ---------- Start ----------
fitCamera();
rollover();
write(KEY, st);
info.found.forEach(f => book.add(f)); write(BOOK, [...book]);
if (rolled === 'new') say(keeps.length && keeps[0].n === CAL.valley - 1 ? `Valley ${CAL.valley - 1} is framed under Past valleys. A fresh valley, and your shed is restocked.` : 'A fresh valley for a new season.');
else if (rolled === 'day') say(st.pending.length ? `A new day. ${st.pending.map(p => REQ[p.id].who).join(' and ')} ${st.pending.length > 1 ? 'are' : 'is'} still hoping.` : 'A new day, and five new tiles.');
if (FAKE) say(`Testing as ${TODAY}. ` + document.getElementById('status').textContent);
renderTray(); renderSide(); refreshHints(); syncFolk();
NIGHT.addEventListener('change', () => paintScene(g, 0, true));
requestAnimationFrame(frame);
</script>
