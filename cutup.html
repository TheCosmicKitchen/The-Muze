<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cut-up · The Muze</title>
<meta name="description" content="Make a new poem from strips cut out of old ones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Caslon+Text:ital@0;1&display=swap">
<link rel="stylesheet" href="muze.css">
<style>
/* Layout: prompt, your poem (strips you've pasted down), then the scrap pile of loose strips. */
.board{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:20px 18px;min-height:120px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--paper-edge),0 10px 30px -18px rgba(0,0,0,.45)}
.board:empty::before{content:"Tap strips below to paste them here.";color:#8A8072;font:15px var(--body);margin:auto}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.row .t{font:18px/1.4 var(--serif)}
.row .t span{cursor:pointer;border-radius:3px}
.row .t span:hover{background:rgba(0,0,0,.07)}
.row .t span.cut{text-decoration:line-through;color:#B0A796}
.row .ctl{display:flex;gap:2px}
.row button{width:32px;height:32px;border:0;border-radius:8px;background:none;color:#7B7264;font:600 16px var(--display);cursor:pointer}
.row button:hover{background:rgba(0,0,0,.07);color:#221F1B}
.pile{display:flex;flex-wrap:wrap;gap:8px}
.strip{background:var(--surface);color:var(--ink);border:0;font:16px/1.3 var(--serif);text-align:left;padding:8px 12px;border-radius:2px;cursor:pointer;box-shadow:0 1px 0 var(--line);max-width:100%}
.strip:hover{box-shadow:0 0 0 2px var(--line)}
.strip.used{opacity:.3}
.strip small{display:block;font:600 10px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.sect{font:600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="prompt" id="prompt"></div>
  <div class="board" id="board"></div>
  <div class="tools">
    <button class="btn primary" id="done">Finish</button>
    <button class="btn" id="copy">Copy</button>
    <button class="btn" id="save">Save image</button>
  </div>
  <div class="sect">Scraps</div>
  <div class="pile" id="pile"></div>
  <p class="foot">Tap a word in your poem to cut it out · lines from public-domain poems on Project Gutenberg</p>
</div>
<script src="data/lines.js"></script>
<script src="muze.js"></script>
<script>
Muze.header({ title: 'Cut-up', another: 'Another pile' });
const GAME = 'cutup', MAX = 10;
const THEMES = ['Write about a door', 'Write about the sea', 'Write about someone leaving', 'Write a lullaby', 'Write a spell',
  'Write about a house at night', 'Write about the weather inside you', 'Write a letter to the moon', 'Write a love poem',
  'Write about something small', 'Write about a garden', 'Write about time', 'Write a warning', 'Write about a bird', 'Write anything'];

// Eighteen strips a day, no more than three from any one poet.
const r = Muze.rng(Muze.seed + 'cutup');
const per = {}, strips = [];
for (const i of Muze.shuffle(LINES.map((_, i) => i), r)) {
  const a = LINES[i].a; if ((per[a] = (per[a] || 0) + 1) > 3) continue;
  strips.push(i); if (strips.length === 18) break;
}
const theme = Muze.pick(THEMES, r);
document.getElementById('prompt').innerHTML =
  `<span class="k">Today's scraps</span><span class="v">${theme}</span><span class="s">Up to ${MAX} lines from ${new Set(strips.map(i => LINES[i].a)).size} poets. Reorder them, cut words out, make it yours.</span>`;

const st = Muze.load(GAME) || { rows: [], done: false };   // rows: [{s: strip index, cut: [word indexes]}]
const wordsOf = s => LINES[strips[s]].t.split(' ');
const rowText = row => wordsOf(row.s).filter((_, k) => !row.cut.includes(k)).join(' ');
const text = () => st.rows.map(rowText).filter(Boolean).join('\n');
const poets = () => [...new Set(st.rows.map(row => POETS[LINES[strips[row.s]].a].split(' ').pop()))];

const board = document.getElementById('board'), pile = document.getElementById('pile');
function render() {
  board.innerHTML = '';
  st.rows.forEach((row, ri) => {
    const el = document.createElement('div'); el.className = 'row';
    const t = document.createElement('div'); t.className = 't';
    wordsOf(row.s).forEach((w, k) => {
      const s = document.createElement('span'); s.textContent = w; s.className = row.cut.includes(k) ? 'cut' : '';
      s.onclick = () => { const j = row.cut.indexOf(k); j < 0 ? row.cut.push(k) : row.cut.splice(j, 1); st.done = false; persist(); };
      t.append(s, ' ');
    });
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    [['↑', 'Move up', -1], ['↓', 'Move down', 1], ['✕', 'Remove line', 0]].forEach(([lab, aria, d]) => {
      const b = document.createElement('button'); b.textContent = lab; b.setAttribute('aria-label', aria);
      b.onclick = () => {
        if (!d) st.rows.splice(ri, 1);
        else if (st.rows[ri + d]) [st.rows[ri], st.rows[ri + d]] = [st.rows[ri + d], st.rows[ri]];
        st.done = false; persist();
      };
      ctl.append(b);
    });
    el.append(t, ctl); board.append(el);
  });
  pile.innerHTML = '';
  const used = new Set(st.rows.map(x => x.s));
  strips.forEach((li, s) => {
    const b = document.createElement('button'); b.className = 'strip' + (used.has(s) ? ' used' : '');
    b.style.transform = `rotate(${(Muze.rng(Muze.seed + s)() - 0.5) * 2.4}deg)`;
    b.innerHTML = `${LINES[li].t}<small>${POETS[LINES[li].a]}</small>`;
    b.onclick = () => {
      if (used.has(s)) return Muze.toast('Already in your poem');
      if (st.rows.length >= MAX) return Muze.toast(`${MAX} lines is the limit`);
      st.rows.push({ s, cut: [] }); st.done = false; persist();
    };
    pile.append(b);
  });
  document.getElementById('done').textContent = st.done ? 'Finished ✓' : 'Finish';
}
function persist() { Muze.save(GAME, st); render(); }

document.getElementById('done').onclick = () => {
  if (st.rows.length < 2) return Muze.toast('Paste down at least two lines');
  st.done = true; Muze.keep(GAME, text()); persist();
};
document.getElementById('copy').onclick = () => {
  if (!st.rows.length) return Muze.toast('Nothing pasted yet');
  Muze.copy(`${text()}\n\n(cut up from ${poets().join(', ')})\n${Muze.tag}`);
};
document.getElementById('save').onclick = async () => {
  if (!st.rows.length) return Muze.toast('Nothing pasted yet');
  await document.fonts.ready;
  Muze.download(Muze.card({ blocks: [
    { text: text(), font: '34px "Libre Caslon Text", Georgia, serif', lh: 52, align: 'left' },
    { text: `cut up from ${poets().join(', ')}`, font: 'italic 22px "Libre Caslon Text", Georgia, serif', color: '#7B7264', gap: 40 },
    { text: Muze.tag.toUpperCase(), font: '600 18px Fredoka, sans-serif', color: '#7B7264', gap: 14 },
  ] }), 'cut-up');
};
render();
</script>
</body>
</html>
