<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Collage · The Muze</title>
<meta name="description" content="Cut pieces out of three public-domain artworks and collage them into something new.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600;700&family=Libre+Caslon+Text:ital@0;1&display=swap">
<link rel="stylesheet" href="muze.css">
<link rel="stylesheet" href="cutpaste.css">
<style>
/* Layout: prompt; scraps and select tools on the left; the collage board and its fine-tuning panel on the right. */
#board{aspect-ratio:4/5}
.bgs{display:flex;gap:6px}
.bgs button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.bgs button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="prompt" id="prompt"></div>
  <div class="cp-cols">
    <div class="cp-col">
      <div class="sect">Scraps</div>
      <div class="cp-thumbs" id="thumbs"></div>
      <div id="tools"></div>
      <div id="view"></div>
      <div class="cred" id="cred"></div>
    </div>
    <div class="cp-col">
      <div class="tools"><span class="sect">Your collage</span><span class="gap"></span><div class="bgs" id="bgs"></div></div>
      <div id="board"></div>
      <div id="panel"></div>
      <div class="tools">
        <button class="btn primary" id="done">Done</button>
        <button class="btn" id="save">Save image</button>
      </div>
    </div>
  </div>
  <p class="foot">Artworks: Art Institute of Chicago, public domain (CC0) · your collage stays on this device</p>
</div>
<script src="data/art.js"></script>
<script src="muze.js"></script>
<script src="cutpaste.js"></script>
<script>
Muze.header({ title: 'Collage', another: 'Other scraps' });
const GAME = 'collage';
const THEMES = ['Make a creature', 'Make a place you\'d like to visit', 'Make a portrait of someone who doesn\'t exist', 'Make an album cover',
  'Make a dream you had', 'Make a city', 'Make a still life of impossible things', 'Make a poster for a film that doesn\'t exist',
  'Make a new constellation', 'Make a garden', 'Make a vehicle', 'Make a party', 'Make the weather', 'Make anything'];
const r = Muze.rng(Muze.seed + 'collage');
const works = Muze.shuffle(ART.map((_, i) => i), r).slice(0, 3).map(i => ART[i]);
const theme = Muze.pick(THEMES, r);
document.getElementById('prompt').innerHTML =
  `<span class="k">Today's scraps</span><span class="v">${theme}</span><span class="s">Three artworks to cut up. Pick a select tool, cut a shape, then arrange the pieces.</span>`;

const st = Muze.load(GAME) || { items: [], bg: 0, done: false };
// Saves from before the select-tool update kept pieces under `pieces`.
if (st.pieces) { st.items = st.pieces.map(p => ({ ...p, k: 'p' })); delete st.pieces; }
const persist = () => { st.done = st.done && st.items.length > 0; Muze.save(GAME, st); renderDone(); };
const cp = CutPaste.create({
  st, persist, base: 600,
  els: { thumbs: thumbs, tools: tools, view: view, credit: cred, board: board, panel: panel },
  empty: 'Cut a shape out of a painting. Pieces land here.',
  sources: works.map(w => ({ src: `art/${w.i}.jpg`, label: `${w.t} by ${w.a}`,
    credit: `<i>${w.t}</i>, ${w.a}${w.d ? `, ${w.d}` : ''} · <a href="https://www.artic.edu/artworks/${w.id}" target="_blank" rel="noopener">Art Institute of Chicago</a>` })),
});

const BGS = ['#FAF6EC', '#C9A87C', '#1E1B17', '#BFD7EA'];
BGS.forEach((c, i) => {
  const b = document.createElement('button'); b.style.background = c; b.setAttribute('aria-label', `Background ${i + 1}`);
  b.onclick = () => { st.bg = i; Muze.save(GAME, st); paintBg(); };
  bgs.append(b);
});
function paintBg() { board.style.background = BGS[st.bg]; bgs.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', i === st.bg)); }
paintBg();

const doneBtn = document.getElementById('done');
function renderDone() { doneBtn.textContent = st.done ? 'Done ✓' : 'Done'; }
doneBtn.onclick = () => {
  if (!st.items.length) return Muze.toast('Cut out a piece first');
  st.done = true; Muze.save(GAME, st); renderDone(); Muze.toast('Pasted down');
};
renderDone();
document.getElementById('save').onclick = async () => {
  if (!st.items.length) return Muze.toast('Cut out a piece first');
  const W = 1200, H = 1500, foot = 110;
  const c = document.createElement('canvas'); c.width = W; c.height = H + foot;
  const g = c.getContext('2d');
  g.fillStyle = BGS[st.bg]; g.fillRect(0, 0, W, H);
  await cp.draw(g, W, H, 'p');
  g.fillStyle = '#FBF6EC'; g.fillRect(0, H, W, foot);
  g.fillStyle = '#7A6A5D'; g.textAlign = 'center';
  g.font = '700 24px Nunito, sans-serif'; g.fillText(`${theme} · ${Muze.tag}`, W / 2, H + 42);
  const used = [...new Set(st.items.map(it => it.a))].map(a => `${works[a].t} (${works[a].a})`).join(' · ');
  g.font = 'italic 18px "Libre Caslon Text", Georgia, serif';
  g.fillText(`Cut from ${used}`.slice(0, 140), W / 2, H + 78);
  Muze.download(c, 'collage');
};
</script>
</body>
</html>
